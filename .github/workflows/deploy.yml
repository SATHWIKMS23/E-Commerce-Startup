name: AtlasBasket Production CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Prevent concurrent production deployments; queue subsequent runs
concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

# Minimal permissions: read-only repository contents
permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Backend
    # Protect production environment with GitHub Environment approval gates
    environment: production
    # Security restriction: Only run for the official repository and main branch / authorized dispatch
    if: github.repository == 'STARTUP-GIT/E-Commerce-Startup' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, atlasbasket-prod]
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Verify VM Environment & Infrastructure Dependencies
        run: |
          echo "============================================================"
          echo " Pre-Flight Environment Validation"
          echo " Target Host: AtlasBasket VM (192.168.122.90)"
          echo "============================================================"

          SECRETS_PATH="/home/sathwik-atlasbasket/apps/atlasbasket/secrets/backend.env"
          if [ ! -f "$SECRETS_PATH" ]; then
            echo "::error::Production environment file missing at $SECRETS_PATH"
            exit 1
          fi
          echo "[OK] Production environment file verified."

          if ! docker info > /dev/null 2>&1; then
            echo "::error::Docker daemon is not accessible. Verify user permissions."
            exit 1
          fi
          echo "[OK] Docker daemon is responsive."

          if ! docker network inspect atlasbasket-vm-net > /dev/null 2>&1; then
            echo "External network 'atlasbasket-vm-net' not found; creating it..."
            docker network create atlasbasket-vm-net
          fi
          echo "[OK] Docker network 'atlasbasket-vm-net' ready."

          # Verify unmanaged infrastructure dependencies are active.
          # Missing PostgreSQL or Redis is a deployment-blocking failure.
          if ! docker ps --format '{{.Names}}' | grep -q "^atlasbasket-postgres$"; then
            echo "::error::Pre-flight failure: Required container 'atlasbasket-postgres' is not running! Deployment blocked to protect data integrity."
            exit 1
          fi
          echo "[OK] PostgreSQL container 'atlasbasket-postgres' is active."

          if ! docker ps --format '{{.Names}}' | grep -q "^atlasbasket-vm-redis$"; then
            echo "::error::Pre-flight failure: Required container 'atlasbasket-vm-redis' is not running! Deployment blocked to protect caching/session integrity."
            exit 1
          fi
          echo "[OK] Redis container 'atlasbasket-vm-redis' is active."

      - name: Execute Safe Production Deployment
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          chmod +x backend/scripts/deploy.sh
          chmod +x backend/scripts/rollback.sh
          bash backend/scripts/deploy.sh
